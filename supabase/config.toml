# Configuração do Supabase versionada. Aplicar no projeto: npx supabase config push

project_id = "area-aluno-ca"

[auth]
enabled = true
# Endereço principal do app (usado nos links do e-mail)
site_url = "https://area-aluno-ca.vercel.app"
additional_redirect_urls = ["https://area-aluno-ca.vercel.app/**", "http://localhost:3000/**", "https://*.vercel.app/**"]
jwt_expiry = 3600
# Só entra quem o professor cadastrou
enable_signup = false

[auth.email]
# Atenção: aqui "enable_signup" liga o login por e-mail. Tem que ficar true.
# Quem impede cadastro aberto é o enable_signup = false da seção [auth].
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

# Modelo próprio do e-mail (exige SMTP próprio: hoje o Gmail do Carlos, configurado no painel do Supabase;
# a senha de app fica só lá, nunca neste arquivo).
[auth.email.template.magic_link]
subject = "Seu acesso à Área do Aluno CA"
content_path = "./supabase/templates/link-magico.html"

# Limite de e-mails por hora: ajustado no painel (Authentication > Rate Limits); o config push não gerencia.
