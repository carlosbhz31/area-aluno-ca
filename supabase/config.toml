# Configuração do Supabase versionada. Aplicar no projeto: npx supabase config push

project_id = "area-aluno-ca"

[auth]
enabled = true
# Endereço principal do app (usado nos links do e-mail)
site_url = "https://area-aluno-ca.vercel.app"
additional_redirect_urls = ["https://area-aluno-ca.vercel.app/**", "http://localhost:3000/**", "https://*.vercel.app/**"]
jwt_expiry = 3600
# Só entra quem o professor cadastrou
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

# O plano grátis só permite trocar o modelo do e-mail com SMTP próprio (Resend + domínio).
# Quando houver domínio, descomente e rode `npx supabase config push`.
